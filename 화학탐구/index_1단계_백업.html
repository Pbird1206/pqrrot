<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미적분I 수행</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="control">
        <label for="acid-conc">아세트산 농도 (M)</label>
        <input type="range" id="acid-conc" min="0.01" max="0.50" step="0.01" value="0.10">
        <span id="acid-conc-value">0.10</span>
    </div>
    <div class="control">
        <label for="base-conc">NaOH 농도 (M)</label>
        <input type="range" id="base-conc" min="0.01" max="0.50" step="0.01" value="0.10">
        <span id="base-conc-value">0.10</span>
    </div>
    <div class="control">
        <label for="acid-vol">아세트산 부피 (mL)</label>
        <input type="range" id="acid-vol" min="5.0" max="50.0" step="1" value="25">
        <span id="acid-vol-value">25</span>
    </div>

    <p>현재 pH : <span id="ph-value">-</span></p>
    <canvas id="titration-chart"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="chem.js"></script>
    <script src="main.js"></script>
</body>
</html>
